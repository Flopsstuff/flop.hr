name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
        # The owners page derives "Last update" from the last commit that
        # touched public/owners.json, so the full history has to be present.
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      run: |
        corepack enable
        yarn install --immutable

    - name: Build static site
      run: yarn build

    - name: Deploy to Cloudflare Workers
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Installed with npm so it stays outside the immutable yarn project.
        packageManager: npm
        wranglerVersion: "4.120.0"
        # Everything else (worker name, assets dir, custom domain) is in wrangler.jsonc.
        command: deploy
